# GTX 1080 server: llama.cpp (CUDA) + AnythingLLM + SharePoint sync (Graph API)
# vLLM does not support Pascal GPUs (compute capability 6.1), so llama.cpp is used here.
name: local-llm

services:
  anythingllm:
    image: mintplexlabs/anythingllm:${ANYTHINGLLM_TAG:-latest}   # pin a version before production
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      # Set ANYTHINGLLM_BIND to the box's Tailscale IP so it isn't exposed on the LAN.
      # Docker-published ports bypass UFW.
      - "${ANYTHINGLLM_BIND:-0.0.0.0}:${ANYTHINGLLM_PORT:-3001}:3001"
    environment:
      STORAGE_DIR: /app/server/storage
      JWT_SECRET: ${ANYTHINGLLM_JWT_SECRET}
      DISABLE_TELEMETRY: "true"
      VECTOR_DB: lancedb
      # Chat model (llm service)
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_BASE_PATH: http://llm:8000/v1
      GENERIC_OPEN_AI_MODEL_PREF: local-model
      GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT: ${LLM_CTX:-32768}
      GENERIC_OPEN_AI_MAX_TOKENS: "2048"     # room for KB drafts
      GENERIC_OPEN_AI_API_KEY: ${VLLM_API_KEY}
      # Embedding model (embed service)
      EMBEDDING_ENGINE: generic-openai
      EMBEDDING_BASE_PATH: http://embed:8000/v1
      EMBEDDING_MODEL_PREF: embed-model
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: "1000"
      GENERIC_OPEN_AI_EMBEDDING_API_KEY: ${VLLM_API_KEY}
    volumes:
      - anythingllm-storage:/app/server/storage
      # Agent skill from git. Read-only, so it's always on: set "active": false in git to disable.
      - ./anythingllm/agent-skills/save-to-case-file:/app/server/storage/plugins/agent-skills/save-to-case-file:ro
      # The skill writes drafts here; the sync service uploads them to SharePoint.
      - ${OUTBOX_DIR:-/srv/llm/outbox}:/outbox
    depends_on:
      llm:
        condition: service_healthy
      embed:
        condition: service_healthy

  sync:
    build:
      context: ./sync
      args:
        UID: ${PUID:-1000}
        GID: ${PGID:-1000}
    restart: unless-stopped
    init: true
    environment:
      TENANT_ID: ${SP_TENANT_ID}
      CLIENT_ID: ${SP_CLIENT_ID}
      SP_HOSTNAME: ${SP_HOSTNAME}
      SP_SITE_PATH: ${SP_SITE_PATH}
      SP_DRIVE_NAME: ${SP_DRIVE_NAME:-Documents}
      SP_CASES_ROOT: ${SP_CASES_ROOT:-Cases}
      ANYTHINGLLM_URL: http://anythingllm:3001
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-300}
      SKIP_SUBFOLDERS: ${SKIP_SUBFOLDERS:-Drafts}
      OUTBOX_SUBFOLDERS: ${OUTBOX_SUBFOLDERS:-Drafts,Transcripts,Billing}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-.pdf,.docx,.txt,.md,.csv,.xlsx,.pptx,.odt,.html,.json,.epub}
      MAX_FILE_MB: ${MAX_FILE_MB:-100}
      WORKSPACE_PROMPT_FILE: /config/workspace-prompt.txt
      LOG_NAMES: ${SYNC_LOG_NAMES:-false}   # file names can contain patient names
    volumes:
      - ${SYNC_CERTS_DIR:-./sync/certs}:/certs:ro
      - ./sync/config:/config:ro
      - ${SYNC_STATE_DIR:-/srv/llm/sync-state}:/state
      - ${OUTBOX_DIR:-/srv/llm/outbox}:/outbox
    depends_on:
      - anythingllm
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/state/heartbeat') < int(os.environ.get('SYNC_INTERVAL','300'))*3+600 else 1)"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 15m

  embed:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMACPP_TAG:-server-cuda}
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llm-models:/models
    command:
      - -hf
      - ${EMBED_GGUF:-Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0}
      - --alias
      - embed-model
      - --embedding
      - --pooling
      - last
      - -c
      - "8192"
      - -b
      - "2048"
      - -ub
      - "2048"
      - -ngl
      - "0"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  llm:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMACPP_TAG:-server-cuda}
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llm-models:/models
    command:
      - -hf
      - ${LLM_GGUF:-unsloth/Qwen3.5-4B-GGUF:Q4_K_M}
      - --alias
      - local-model
      - -c
      - ${LLM_CTX:-32768}
      - -ngl
      - "99"
      - --jinja
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
      - --temp
      - "0.7"
      - --top-p
      - "0.8"
      - --top-k
      - "20"
      - --min-p
      - "0"
      - --presence-penalty
      - "1.5"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

volumes:
  anythingllm-storage:
  llm-models: